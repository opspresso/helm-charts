# Values of one application: a Deployment or Argo Rollout with its Service,
# routing, scaling, configuration and policies.
#
# workloadDefaults holds the settings of one workload. The YAML merge below
# copies them into the root before Helm merges user values, and every worker in
# `workloads` starts from the same defaults. A worker therefore never inherits
# the main application's probes, scaling or credentials.
workloadDefaults: &workloadDefaults
  # Set false to omit this workload. A parent chart can then render it itself.
  enabled: true

  ## Chart Identity
  nameOverride: ""
    # nameOverride: "my-app"
  fullnameOverride: ""
    # fullnameOverride: "my-app-fullname"
  # Namespace of the rendered objects. Defaults to the release namespace.
  namespaceOverride: ""
  # Labels added to every object and Pod of this workload.
  additionalLabels: {}
    # team: backend
    # environment: production

  ## Controller (Deployment / Rollout)
  controller:
    # Set false to omit the Deployment or Rollout of the main app.
    enabled: true
    # Annotations of the Deployment or Rollout object, not of its Pods.
    annotations: {}
      # argocd.argoproj.io/sync-wave: "1"
    kind: Deployment # Deployment or Rollout

    strategy:
      type: RollingUpdate # RollingUpdate; BlueGreen or Canary need kind Rollout
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 0
      blueGreen:
        autoPromotionEnabled: true
        autoPromotionSeconds: 60
      canary:
        steps: []
        # - setWeight: 10
        # - pause:
        #     duration: 60
        # - setWeight: 50
        # - pause:
        #     duration: 60

  # Ignored when autoscaling.enabled is true: the HPA owns the replica count.
  replicaCount: 1

  revisionHistoryLimit: 3

  ## Container Image
  image:
    # Complete reference (including a digest, if needed); overrides repository/tag.
    reference: ""
      # reference: "registry.example.com/my-app@sha256:..."
    repository: nginx
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []
    # - name: my-registry-secret

  ## Container Spec
  containerName: app

  command: []
    # - "aws"
    # - "s3"
    # - "ls"

  args: []
    # - --host
    # - 0.0.0.0

  env: []
    # - name: MESSAGE
    #   value: "hello world"

  # Explicit envFrom replaces the generated configmap, secret and
  # externalSecrets references when set.
  envFrom: []
    # - secretRef:
    #     name: shared-secret
    #     optional: true

  # Container ports in addition to the Service port.
  extraPorts: []
    # - name: metrics
    #   containerPort: 9090
    #   protocol: TCP

  startupProbe: {}
    # httpGet:
    #   path: /
    #   port: http
    # initialDelaySeconds: 0
    # periodSeconds: 10
    # failureThreshold: 30

  readinessProbe: {}
    # httpGet:
    #   path: /
    #   port: http
    # initialDelaySeconds: 3
    # periodSeconds: 10
    # failureThreshold: 3

  livenessProbe: {}
    # httpGet:
    #   path: /
    #   port: http
    # initialDelaySeconds: 3
    # periodSeconds: 10
    # failureThreshold: 3

  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   memory: 128Mi

  securityContext: {}
    # allowPrivilegeEscalation: false
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 15"]

  ## Init & Sidecar Containers
  initContainers: []
    # - name: init-data
    #   image: busybox
    #   command: ["sh", "-c", "echo init"]

  sidecars: []
    # - name: log-shipper
    #   image: fluentd:latest
    #   volumeMounts:
    #     - name: logs
    #       mountPath: /var/log

  ## Configuration & Secrets
  # Each enabled source is added to the container envFrom unless envFrom is set.
  # A ConfigMap or Secret owned by this chart also restarts the Pods on change.
  configmap:
    enabled: false
    data: {}
      # MESSAGE: "hello world"

  # Values must be base64 encoded.
  secret:
    enabled: false
    data: {}
      # SECRET_MESSAGE: "c2VjcmV0IG1lc3NhZ2U="

  # ConfigMaps and Secrets that other charts or operators create.
  additionalConfigmap:
    enabled: false
    names: []
      # - "additional-configmap"

  additionalSecret:
    enabled: false
    names: []
      # - "additional-secret"

  # External Secrets Operator ExternalSecret.
  externalSecrets:
    enabled: false
    # ExternalSecret and target Secret name. Defaults to <fullname>-external.
    name: ""
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
    # A namespaced SecretStore owned by this release. When enabled, the
    # ExternalSecret reads from it and secretStoreRef is not used.
    secretStore:
      enabled: false
      # Defaults to the fullname.
      name: ""
      # SecretStore spec.provider, evaluated as a Helm template.
      provider: {}
        # aws:
        #   service: ParameterStore
        #   region: ap-northeast-2
        #   role: arn:aws:iam::123456789012:role/my-app-secrets
    # One Secret key per remote value.
    data: []
      # - key: /k8s/common/demo
      #   name: admin-password
      #   property: demo/admin-password
    # ExternalSecret spec.dataFrom, evaluated as a Helm template.
    dataFrom: []
      # - find:
      #     path: /k8s/common/demo
      #     name:
      #       regexp: ".*"
    # Marks the generated envFrom reference optional. Use it when dataFrom can
    # match no keys: External Secrets then creates no Secret.
    optional: false

  ## Pod Metadata & Spec
  podLabels: {}
    # app.kubernetes.io/component: api

  # Evaluated as a Helm template against the final values.
  podAnnotations: {}
    # prometheus.io/scrape: "true"
    # checksum/extra: '{{ .Values.extra | toJson | sha256sum }}'

  # null keeps the Kubernetes default; true or false is rendered explicitly.
  automountServiceAccountToken: null

  podSecurityContext: {}
    # runAsUser: 1000
    # runAsGroup: 3000
    # fsGroup: 2000
    # seccompProfile:
    #   type: RuntimeDefault

  priorityClassName: ""

  dnsPolicy: ClusterFirst # ClusterFirst, Default

  dnsConfig: {}
    # options:
    #   - name: ndots
    #     value: "2"

  terminationGracePeriodSeconds: 30

  ## Storage
  persistence:
    enabled: false
    # storageClassName: default
    accessModes:
    - ReadWriteOnce
    size: 10Gi
    # existingClaim: ""
    mountPath: "/data"
    # subPath: ""
    # selectorLabels: {}  # PVC spec.selector.matchLabels, for binding to a pre-provisioned PV

  extraVolumes: []
    # - name: extras
    #   emptyDir: {}

  extraVolumeMounts: []
    # - name: extras
    #   mountPath: /usr/share/extras
    #   readOnly: true

  ## Scheduling
  nodeSelector: {}
    # kubernetes.io/os: linux
    # node.kubernetes.io/instance-type: m5.large

  tolerations: []
    # - key: "dedicated"
    #   operator: "Equal"
    #   value: "app"
    #   effect: "NoSchedule"

  affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: topology.kubernetes.io/zone
    #             operator: In
    #             values:
    #               - ap-northeast-2a
    #               - ap-northeast-2c

  # Preferred anti-affinity between Pods of this workload. Do not combine with
  # affinity.podAntiAffinity.
  podAntiAffinity: {}
    # topologyKey: "topology.kubernetes.io/zone"

  topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: DoNotSchedule
    #   labelSelector:
    #     matchLabels:
    #       app.kubernetes.io/name: my-app

  ## ServiceAccount, RBAC & IAM
  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-app-role
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Grants the rules to the ServiceAccount. Requires a ServiceAccount from
  # serviceAccount.create, serviceAccount.name or irsa.enabled.
  rbac:
    create: false
    # false: ClusterRole and ClusterRoleBinding.
    # true: Role and RoleBinding in the release namespace only.
    namespaced: false
    rules: []
      # - apiGroups:
      #     - ""
      #   resources:
      #     - "configmaps"
      #   verbs:
      #     - "get"

  # Creates the ServiceAccount with the IRSA role annotation.
  irsa:
    enabled: false
    roleArn: ""
      # roleArn: "arn:aws:iam::123456789012:role/my-app-role"

  ## Service & Networking
  service:
    # Set false for a worker: this omits the Service, its container port and
    # the connection test.
    enabled: true
    type: ClusterIP
    # Port name of the Service and the container.
    name: http
    protocol: TCP
    # Container port.
    targetPort: 3000
    # Service port.
    port: 80
    # Service ports in addition to the main port. Declare each targetPort in
    # extraPorts so that the container exposes it.
    extraPorts: []
      # - name: metrics
      #   port: 9090
      #   targetPort: metrics
      #   protocol: TCP
    # Annotations to add to the service
    annotations: {}
      # service.kubernetes.io/topology-aware-hints: auto

  # External routes to the Service. Enable one of ingress, istio or httpRoute.
  routing:
    hosts:
      - sample.domain.com
    path: /
    pathType: Prefix # Prefix or Exact; HTTPRoute renders Prefix as PathPrefix

    ingress:                    # deprecated
      enabled: false
      className: ""
      annotations: {}
        # cert-manager.io/cluster-issuer: "letsencrypt-issuer"
        # kubernetes.io/ingress.class: "nginx"
        # kubernetes.io/ssl-redirect: "true"
      tls: []
      #  - secretName: sample-tls
      #    hosts:
      #      - sample.domain.com

    # Istio Gateway and VirtualService.
    istio:
      enabled: false
      annotations: {}
      gateway:
        selector:
          istio: default-ingress-gateway

    # Gateway API HTTPRoute attached to an existing Gateway.
    httpRoute:
      enabled: false
      annotations: {}
      parentRefs:
        - name: infra-gateway
          namespace: istio-system

    # Gateway API Gateway owned by this release.
    gateway:
      enabled: false
      annotations: {}
      # Defaults to <fullname>-gateway.
      name: ""
      className: traefik
      listeners:
        - name: https
          protocol: HTTPS
          port: 443
          tls:
            mode: Terminate
            certificateRefs: []
          allowedRoutes:
            namespaces:
              from: Same

    # Gateway API BackendTLSPolicy. Requires httpRoute.enabled.
    backendTLSPolicy:
      enabled: false
      annotations: {}
      targetRefs:
        - kind: Service
          name: http
          port: 80
      validation:
        trust:
          secret:
            name: backend-tls-secret

  # Istio mesh traffic policy for this Service — applies to in-mesh callers, so it
  # is useful without any gateway or routing (e.g. session affinity for a
  # cluster-internal server). Required when enabled. No TLS settings are rendered,
  # so Istio auto-mTLS stays untouched.
  destinationRule:
    enabled: false
    annotations: {}
    trafficPolicy: {}
      # loadBalancer:
      #   consistentHash:
      #     httpHeaderName: mcp-session-id

  ## Scaling & Availability
  # Requires at least one metric. The HPA owns the replica count.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    behavior: {}
      # scaleDown:
      #   policies:
      #     - periodSeconds: 60
      #       type: Percent
      #       value: 25
      #   stabilizationWindowSeconds: 600
    metrics: []
      # - type: Resource
      #   resource:
      #     name: cpu
      #     target:
      #       type: Utilization
      #       averageUtilization: 60
      # - type: ContainerResource
      #   containerResource:
      #     name: cpu
      #     container: app
      #     target:
      #       type: Utilization
      #       averageUtilization: 60

  # Set minAvailable or maxUnavailable, not both. Without either, maxUnavailable is 1.
  pdb:
    enabled: false
    # maxUnavailable: 1
    # minAvailable: 1

  ## Monitoring
  # Prometheus Operator ServiceMonitor. Rendered only when the cluster serves
  # monitoring.coreos.com/v1.
  serviceMonitor:
    enabled: false
    labels:
      release: prometheus-operator
    endpoints:
    - interval: 10s
      path: /metrics
      port: http

<<: *workloadDefaults

## Release Resources
# These settings apply once per release. They are not in workloadDefaults.

# Additional worker Deployments. Each item accepts the settings above and an
# optional overrides YAML template evaluated in the main app context after the
# values merge. Workers render only a Deployment or Rollout.
workloads: {}
  # worker:
  #   fullnameOverride: my-app-worker
  #   service:
  #     enabled: false
  #   command: [node, worker.js]
  #   overrides: |
  #     image: {{ toYaml .Values.image | nindent 2 }}

# Allows only the listed traffic to every Pod of this release: the main app and
# its workers. Workers must stay in the release namespace. Each direction in policyTypes without rules denies all traffic.
networkPolicy:
  enabled: false
  policyTypes: [Ingress] # Ingress, Egress
  ingress: []
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: istio-system
    #   ports:
    #     - protocol: TCP
    #       port: 3000
  egress: []
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: kube-system
    #   ports:
    #     - {protocol: UDP, port: 53}

# Bounds the namespace of this release. Kubernetes enforces every ResourceQuota
# of a namespace, so enable it in one release per namespace.
resourceQuota:
  enabled: false
  hard: {}
    # requests.cpu: "4"
    # requests.memory: 8Gi
    # pods: "12"

# Other objects, rendered by incubator/raw. raw.resources and raw.templates keep
# their upstream behavior. Each raw.parentTemplates entry is a YAML template
# evaluated against the final app values; it may contain several documents.
raw:
  enabled: false
  parentTemplates: []
    # - |
    #   apiVersion: v1
    #   kind: ConfigMap
    #   metadata:
    #     name: {{ include "app.fullname" . }}-extra
    #   data:
    #     image: {{ include "app.image" . | quote }}
