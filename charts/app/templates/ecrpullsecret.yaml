{{- with .Values.ecrPullSecret }}
{{- if .enabled }}
{{- if not .region }}
{{- fail "ecrPullSecret.enabled requires ecrPullSecret.region." }}
{{- end }}
{{- if not .name }}
{{- fail "ecrPullSecret.enabled requires ecrPullSecret.name." }}
{{- end }}
{{- $generator := .generatorName | default (printf "%s-ecr" (include "app.fullname" $)) }}
{{- $namespaces := list }}
{{- if .releaseNamespace }}
{{- $namespaces = append $namespaces (include "app.namespace" $) }}
{{- end }}
{{- $namespaces = concat $namespaces (.namespaces | default list) | uniq }}
{{- if not $namespaces }}
{{- fail "ecrPullSecret.enabled requires ecrPullSecret.releaseNamespace or ecrPullSecret.namespaces." }}
{{- end }}
{{- range $index, $namespace := $namespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: {{ $generator | quote }}
  namespace: {{ $namespace }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  region: {{ $.Values.ecrPullSecret.region | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.ecrPullSecret.name | quote }}
  namespace: {{ $namespace }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $.Values.ecrPullSecret.refreshInterval | default "1h" }}
  target:
    name: {{ $.Values.ecrPullSecret.name | quote }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # External Secrets renders these fields from the generator output.
        .dockerconfigjson: |
          {"auths":{"{{`{{ .proxy_endpoint }}`}}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}","auth":"{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: {{ $generator | quote }}
{{- end }}
{{- end }}
{{- end }}
