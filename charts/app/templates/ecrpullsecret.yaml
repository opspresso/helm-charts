{{- with .Values.ecrPullSecret }}
{{- if .enabled }}
{{- if not .region }}
{{- fail "ecrPullSecret.enabled requires ecrPullSecret.region." }}
{{- end }}
{{- if not .name }}
{{- fail "ecrPullSecret.enabled requires ecrPullSecret.name." }}
{{- end }}
{{- $generator := .generatorName | default (printf "%s-ecr" (include "app.fullname" $)) }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: {{ $generator | quote }}
  namespace: {{ include "app.namespace" $ }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  region: {{ .region | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
  namespace: {{ include "app.namespace" $ }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  target:
    name: {{ .name | quote }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # External Secrets renders these fields from the generator output.
        .dockerconfigjson: |
          {"auths":{"{{`{{ .proxy_endpoint }}`}}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}","auth":"{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: {{ $generator | quote }}
{{- end }}
{{- end }}
