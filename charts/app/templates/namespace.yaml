{{- /*
The release namespace as an object of this release. Argo CD prunes an object it renders, so the namespace leaves
with its Application; a namespace from the CreateNamespace sync option stays behind. Enable it in one release per namespace.
*/ -}}
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
