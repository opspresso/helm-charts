{{- /*
ExternalSecrets besides the one of the app, each writing its own Secret, for example a scrape token that only
Prometheus reads or a password in another namespace. The map key names the ExternalSecret and its Secret.
*/ -}}
{{- $first := true }}
{{- range $name, $secret := .Values.extraExternalSecrets }}
{{- if not (or $secret.data $secret.dataFrom) }}
{{- fail (printf "extraExternalSecrets.%s requires data or dataFrom." $name) }}
{{- end }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $secret.namespace | default (include "app.namespace" $) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  {{- with $secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- toYaml ($secret.secretStoreRef | default $.Values.externalSecrets.secretStoreRef) | nindent 4 }}
  target:
    {{- toYaml (mergeOverwrite (dict "name" $name "creationPolicy" "Owner") (deepCopy ($secret.target | default dict))) | nindent 4 }}
  {{- with $secret.data }}
  data:
    {{- range . }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $secret.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
