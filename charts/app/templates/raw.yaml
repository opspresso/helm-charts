{{- if .Values.raw.enabled }}
{{/* Render app-scoped extra resources through the pinned incubator/raw dependency. */}}
{{- $resources := list }}
{{- range .Values.raw.parentTemplates }}
{{- range regexSplit "(?m)^---[ \t]*$" (tpl . $) -1 }}
{{- if trim . }}
{{- $resource := fromYaml . }}
{{- if hasKey $resource "Error" }}{{ fail (index $resource "Error") }}{{ end }}
{{- $resources = append $resources $resource }}
{{- end }}
{{- end }}
{{- end }}
{{- $raw := mergeOverwrite (deepCopy .Subcharts.raw) (dict "Values" (mergeOverwrite (deepCopy .Subcharts.raw.Values) (dict "resources" $resources "templates" (list)))) }}
{{ include (printf "%s/charts/raw/templates/resources.yaml" (.Template.BasePath | trimSuffix "/templates")) $raw }}
{{- end }}
