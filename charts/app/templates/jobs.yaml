{{- /*
Jobs of this release, such as an Argo CD hook that checks a schema or creates a database. The Job name is
<fullname>-<key in kebab-case>, and the container runs the app image unless the Job sets its own.
*/ -}}
{{- $first := true }}
{{- range $key, $job := .Values.jobs }}
{{- if or (not (hasKey $job "enabled")) $job.enabled }}
{{- if not (or $job.command $job.args) }}
{{- fail (printf "jobs.%s requires command or args." $key) }}
{{- end }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
{{- $base := include "app.fullname" $ }}
{{- $suffix := kebabcase $key }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" ($base | trunc (max 1 (sub 62 (len $suffix)) | int) | trimSuffix "-") $suffix | trunc 63 | trimSuffix "-" }}
  namespace: {{ $job.namespace | default (include "app.namespace" $) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  {{- with $job.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- range $field := list "backoffLimit" "activeDeadlineSeconds" "ttlSecondsAfterFinished" }}
  {{- if hasKey $job $field }}
  {{ $field }}: {{ index $job $field }}
  {{- end }}
  {{- end }}
  template:
    {{- if or $job.podLabels $job.podAnnotations }}
    metadata:
      {{- with $job.podLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    spec:
      restartPolicy: {{ $job.restartPolicy | default "Never" }}
      {{- with $job.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ $job.automountServiceAccountToken | default false }}
      {{- with (hasKey $job "imagePullSecrets" | ternary $job.imagePullSecrets $.Values.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $job.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $job.containerName | default $suffix }}
          image: {{ $job.image | default (include "app.image" $) | quote }}
          {{- with $job.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- range $field := list "command" "args" "env" "envFrom" "resources" "securityContext" "volumeMounts" }}
          {{- with index $job $field }}
          {{ $field }}:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
{{- end }}
{{- end }}
