# The server accepts only Pods of its namespace and the optional peer, and starts no connection of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres.fullname" . }}
  labels: {{- include "postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postgres.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- if .Values.peer.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "peer.namespace is required" .Values.peer.namespace | quote }}
          {{- with .Values.peer.podLabels }}
          podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 5432}
  egress: []
